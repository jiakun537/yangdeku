```html
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>摇晃吃星星</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            height: 100vh;
            background: #1a1a2e;
            overflow: hidden;
            position: relative;
            font-family: sans-serif;
        }
        #d {
            width: 60px;
            height: 60px;
            position: absolute;
            left: 100px;
            top: 100px;
            background-image: url('chen.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            z-index: 2;
        }
        #star {
            position: absolute;
            width: 30px;
            height: 30px;
            background-image: url('my.gif');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            z-index: 1;
        }
        #score {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 16px;
            z-index: 10;
        }
        #status {
            position: fixed;
            top: 44px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffd166;
            font-size: 13px;
            z-index: 10;
        }
        #btn {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 28px;
            font-size: 16px;
            border: none;
            border-radius: 24px;
            background: #07c160;
            color: #fff;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="score">已吃：0 颗</div>
    <div id="status">点击下方按钮开始</div>
    <div id="star"></div>
    <div id="d"></div>
    <button id="btn">start</button>

    <script>
        var d = document.getElementById('d');
        var star = document.getElementById('star');
        var scoreEl = document.getElementById('score');
        var statusEl = document.getElementById('status');
        var btn = document.getElementById('btn');

        var BASE = 60;
        var MAX_SCALE = 5;
        var eaten = 0;
        var finished = false;
        var started = false;

        var posX = 100, posY = 100;
        var velX = 0, velY = 0;
        var gx = 0, gy = 0;

        var SENS = 0.8;
        var FRIC = 0.98;
        var BOUNCE = 0.6;

        function spawnStar() {
            if (finished) return;
            var pad = 20;
            var maxX = window.innerWidth - 30 - pad;
            var maxY = window.innerHeight - 30 - pad;
            star.style.left = (pad + Math.random() * (maxX - pad)) + 'px';
            star.style.top = (pad + Math.random() * (maxY - pad)) + 'px';
            star.style.display = 'block';
        }

        function checkEat() {
            if (finished) return;
            if (star.style.display === 'none') return;
            var a = d.getBoundingClientRect();
            var b = star.getBoundingClientRect();
            if (!(a.right < b.left || a.left > b.right ||
                  a.bottom < b.top || a.top > b.bottom)) {
                star.style.display = 'none';
                eaten++;
                scoreEl.innerText = '已吃：' + eaten + ' 颗';
                grow();
                if (!finished) setTimeout(spawnStar, 300);
            }
        }

        function grow() {
            var cur = d.offsetWidth;
            var next = cur + BASE * 0.5;
            var maxSize = BASE * MAX_SCALE;
            if (next >= maxSize) {
                next = maxSize;
                finished = true;
                star.style.display = 'none';
                scoreEl.innerText = '已吃：' + eaten + ' 颗（已满级）';
            }
            var cx = posX + cur / 2;
            var cy = posY + cur / 2;
            d.style.width = next + 'px';
            d.style.height = next + 'px';
            posX = cx - next / 2;
            posY = cy - next / 2;
        }

        btn.addEventListener('click', function () {
            if (started) return;
            statusEl.innerText = '正在请求权限...';

            if (typeof DeviceMotionEvent === 'undefined') {
                statusEl.innerText = '❌ 不支持重力感应';
                return;
            }

            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission().then(function (r) {
                    if (r === 'granted') start();
                    else statusEl.innerText = '❌ 权限被拒绝';
                }).catch(function (e) {
                    statusEl.innerText = '❌ 出错：' + e.message;
                });
            } else {
                start();
            }
        });

        function start() {
            started = true;
            btn.innerText = '已开启';
            btn.style.background = '#888';
            statusEl.innerText = '✅ 倾斜手机控制方向';
            window.addEventListener('devicemotion', onMotion);
            spawnStar();
            requestAnimationFrame(loop);
        }

        function onMotion(e) {
            var a = e.accelerationIncludingGravity;
            if (!a) return;
            gx = (a.x || 0) * SENS;
            gy = -(a.y || 0) * SENS;
        }

        function loop() {
            velX += gx;
            velY += gy;
            velX *= FRIC;
            velY *= FRIC;
            posX += velX;
            posY += velY;

            var maxX = window.innerWidth - d.offsetWidth;
            var maxY = window.innerHeight - d.offsetHeight;

            if (posX < 0) { posX = 0; velX = -velX * BOUNCE; }
            if (posY < 0) { posY = 0; velY = -velY * BOUNCE; }
            if (posX > maxX) { posX = maxX; velX = -velX * BOUNCE; }
            if (posY > maxY) { posY = maxY; velY = -velY * BOUNCE; }

            d.style.left = posX + 'px';
            d.style.top = posY + 'px';

            checkEat();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
